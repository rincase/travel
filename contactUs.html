<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>contactUs</title>
    <!-- 導入bootstrap -->
    <link rel="stylesheet" href="./css/bootstrap.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        body {
            font-family: "Microsoft JhengHei", "微軟正黑體", sans-serif;
            /* font-family: "標楷體", cursive; */
        }
    </style>
</head>

<body>
    <!-- 留言板區塊 -->
    <div class="container py-5">
        <div class="card shadow border-0 mx-auto" style="max-width: 600px; border-radius: 16px;">
            <div class="card-body p-4">
                <h4 class="mb-4 text-center fw-bold">💬 留言板</h4>
                <form id="commentForm">
                    <div class="mb-3">
                        <label class="form-label">您的名字</label>
                        <input type="text" class="form-control" id="fromName" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">您的 Email(希望收到回覆的mail)</label>
                        <input type="email" class="form-control" id="fromEmail" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">留言內容</label>
                        <textarea class="form-control" id="message" rows="4" required></textarea>
                    </div>
                    <button type="submit" class="btn btn-dark w-100 rounded-pill">送出留言</button>
                </form>
            </div>
        </div>
    </div>
    <!-- 成功彈窗 -->
    <div class="modal fade" id="successModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content text-center p-4" style="border-radius: 16px;">
                <div class="fs-1 mb-2">✅</div>
                <h5 class="fw-bold">留言送出成功!</h5>
                <p class="text-muted mb-0">感謝你的留言,我們會盡快回覆你</p>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('commentForm').addEventListener('submit', function (e) {
            e.preventDefault();

            // 顯示成功彈窗
            const modal = new bootstrap.Modal(document.getElementById('successModal'));
            modal.show();

            // 清空表單
            document.getElementById('commentForm').reset();

            // 2.5 秒後自動關閉彈窗
            setTimeout(() => modal.hide(), 2500);
        });
    </script>
</body>

</html>
