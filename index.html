        <div class="container-fluid">
            <a class="navbar-brand" href="#">偉琤作品集</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavDropdown"
                aria-controls="navbarNavDropdown" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNavDropdown">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="video.html">影片作品</a>

                        <ul class="dropdown-menu" aria-labelledby="navbarDropdownMenuLink">
                            <li><a class="dropdown-item" href="#">與我聯繫</a></li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <!-- 輪播 (Carousel) -->
    <div id="carouselExampleIndicators" class="carousel slide" data-bs-ride="carousel">
        <div class="carousel-indicators">
            <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="0" class="active"
                aria-current="true" aria-label="Slide 1"></button>
            <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="1"
                aria-label="Slide 2"></button>
            <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="2"
                aria-label="Slide 3"></button>
        </div>
        <!-- 輪播圖片 -->
        <div class="carousel-inner">
            <div class="carousel-item active">
                <img src="./images/101.jpg" class="d-block w-100" alt="...">
            </div>
            <div class="carousel-item">
                <img src="./images/102.jpg" class="d-block w-100" alt="...">
            </div>
            <div class="carousel-item">
                <img src="./images/103.jpg" class="d-block w-100" alt="...">
            </div>
        </div>
        <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleIndicators"
            data-bs-slide="prev">
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Previous</span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleIndicators"
            data-bs-slide="next">
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Next</span>
        </button>
    </div>
    <!-- 最新消息 alert -->
    <!-- 上方、左右設margin，mt-3 mx-3，https://bootstrap5.hexschool.com/docs/5.1/utilities/spacing/ -->
    <!--<div class="alert mt-3 mx-3 alert-primary" role="alert">

    </div>

    </div>

    </div>-->
    <!-- 卡片 -->
    <!-- table的概念 -->
    <!-- 左右maigin，mx-3 -->
    <hr>
    <div class="mx-3">
        <!-- 使用row將每個卡片div包起來，row(12等份)依比例設定-->
        <!-- 設定按鈕寬度，w-100，https://bootstrap5.hexschool.com/docs/5.1/utilities/sizing/ -->
        <!-- 底部maigin，mb-3 -->
        <div class="row">
            <div class="col-md-3 col-sm-6 mb-3">
                <div class="card">
                    <img src="./images/200.jpg" class="card-img-top" alt="...">
                    <div class="card-body">
                        <h5 class="card-title">操場</h5>
                        <p class="card-text">落日夕陽、操場運動的人們</p>
                    </div>
                </div>
            </div>
            <div class="col-md-3 col-sm-6 mb-3">
                <div class="card">
                    <img src="./images/201.jpg" class="card-img-top" alt="...">
                    <div class="card-body">
                        <h5 class="card-title">萬林藝術博物館</h5>
                        <p class="card-text">學校百年來傳承的珍貴文物、考古專業師生發掘的成果、動物標本以及極地科考標本等</p>
                    </div>
                </div>
            </div>
            <div class="col-md-3 col-sm-6 mb-3">
                <div class="card">
                    <img src="./images/202.jpg" class="card-img-top" alt="...">
                    <div class="card-body">
                        <h5 class="card-title">老齋舍</h5>
                        <p class="card-text">依山而建，飛檐碧瓦，由山勢高低分為四層，每棟每層以《千字文》前16字（「天地玄黃、宇宙洪荒、日月盈昃、辰宿列張」）命名，共計16個齋舍。</p>
                    </div>
                </div>
            </div>
            <div class="col-md-3 col-sm-6 mb-3">
                <div class="card">
                    <img src="./images/203.jpg" class="card-img-top" alt="...">
                    <div class="card-body">
                        <h5 class="card-title">圖書館</h5>
                        <p class="card-text">歷史悠久、藏書豐富，其源於1893年清末湖廣總督張之洞創辦的湖北自強學堂圖書室</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
